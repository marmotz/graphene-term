## Graphene Term configuration.
##
## Every setting below is commented out and shows its default value: uncomment a line
## to change it. A missing setting takes its default value; an invalid value or an
## unknown key is reported and ignored.

## Allowed values: "auto", "en-US", "en-GB", "fr", "fr-CA" ("en" is an alias of "en-US",
## case is ignored). "auto" follows the system language and region.
# language = "auto"

# [font]
## Font family name. Run `fc-list : family` to list installed fonts; empty uses system monospace.
# family = ""
## Size in points, from 6 to 72.
# size = 14.0
## Show the ligatures of fonts that have some (Fira Code, JetBrains Mono...).
# ligatures = true
## OpenType features, separated by spaces: "ss01" enables, "-calt" disables, "cv05=2" sets a value.
# features = ""

# [window]
## Startup mode: "default" (configured size), "maximized", or "remember" (last closed window size/state).
# startup_mode = "default"
## Initial window size, in logical pixels.
# width = 960
## Initial window size, in logical pixels.
# height = 600
## Minimum space around the grid, in logical pixels (zero or greater).
# padding = 8
## Default background opacity: 0.0 transparent to 1.0 opaque; needs a compositor. Explicit cell backgrounds, selection and cursor stay opaque; block cards are translucent.
# background_opacity = 1.0
## Show the progress reported by programs (OSC 9;4) in tabs, pane bars, blocks and the taskbar (true or false).
# progress = true

# [scrollback]
## Number of history lines to keep, up to 100000.
# lines = 10000

# [cursor]
## Cursor shape: "block", "beam" or "underline".
# shape = "block"
## Cursor blinking: true or false. Applications can still change this (DECSCUSR).
# blinking = false

# [selection]
## Characters that end a word on double-click.
# word_separators = ",│`|\"' ()[]{}<>\t"

# [tabs]
## Tab bar position: "top", "bottom", "left", "right".
# position = "top"

# [theme]
## Theme name. Built-ins: graphene-night, graphene-day, solarized-dark, solarized-light, gruvbox-dark, gruvbox-light, catppuccin-mocha, catppuccin-latte; custom theme files are also supported.
# name = "graphene-night"
## Optional light theme name (built-in or custom file); set both `light` and `dark` to follow system appearance.
## light = "graphene-day"
## Optional dark theme name (built-in or custom file).
## dark = "graphene-night"

# [updates]
## Check GitHub for a newer release and show a banner (true or false); false makes no network call.
# check = true
## Check interval: "auto", "6h", "12h", "24h", "2d", "3d" or "1w"; "auto" is 6h for dev builds, 24h for stable builds.
# interval = "auto"

# [notifications]
## Notifications requested by programs (OSC 9, OSC 777).
# program = true
## Notify when a command that ran at least `command_threshold` seconds finishes.
# command_finished = true
## Minimum duration of a command for its end to be notified, in whole seconds (at least 1).
# command_threshold = 10
## Turn the terminal bell into a notification.
# bell = false

# [quick_terminal]
## Allow Graphene to start the quick terminal. Off, it is never launched and `graphene --quick-toggle` fails. Applies the next time Graphene starts.
# enabled = false
## Native global shortcut showing or hiding the quick terminal, written like a keyboard shortcut (e.g. "Ctrl+F12"); empty for none.
# hotkey = ""
## Screen edge the quick terminal slides from: "top", "bottom", "left", "right".
# edge = "top"
## Percentage of the screen taken, from 10 to 100: the height for top/bottom, the width for left/right.
# size = 40
## Screen it appears on: "active" (under the mouse cursor), "primary", or a screen name.
# screen = "active"
## Duration of the slide in milliseconds, 0 for none, at most 1000.
# animation_ms = 150
## Hide the quick terminal when it loses the focus.
# hide_on_focus_loss = true
## Start the hidden quick terminal when your graphical session opens, so the global shortcut works at once.
# autostart = false

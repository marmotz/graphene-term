[package]
name = "graphene"
version = "0.2.1"
edition = "2024"
description = "A modern, GPU-accelerated terminal emulator"
authors = ["Marmotz <contact@marmotz.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/marmotz/graphene-term"
readme = "README.md"

# Benchmarks use criterion (`benches/render.rs`): keep the lib and binary out of
# `cargo bench` so criterion's command-line options reach it.
[lib]
bench = false

[[bin]]
name = "graphene"
path = "src/main.rs"
bench = false

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
libc = "0.2.191"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
cosmic-text = "0.19.0"
env_logger = "0.11.11"
log = "0.4.35"
polling = "3.11.0"
pollster = "1.0.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
toml_edit = "0.25.19"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
wgpu = "30.0.1"
winit = "0.30.13"
nucleo-matcher = "0.3.1"
png = "0.18.1"
flate2 = "1.1.11"
base64 = "0.22.1"
notify = "8.2.2"
zbus = "6.3.0"
futures-util = { version = "0.3.34", default-features = false }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard"] }
egui-wgpu = { version = "0.37.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
sys-locale = "0.3.2"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSBox", "NSCell", "NSColor", "NSControl", "NSDockTile", "NSImage", "NSImageCell", "NSImageView", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSGeometry", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
egui-winit = { version = "0.37.0", default-features = false, features = ["wayland", "x11"] }
wl-clipboard-rs = "0.9.5"
x11rb = { version = "0.13.2", features = ["render"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "rayon"] }

[[bench]]
name = "render"
harness = false

[package.metadata.deb]
name = "graphene-term"
maintainer = "Marmotz <contact@marmotz.dev>"
section = "x11"
priority = "optional"
depends = "libc6, libgcc-s1"
extended-description = "Graphene Term is a GPU-accelerated terminal emulator for Linux, written in Rust. The binary is called graphene."
assets = [
    ["target/release/graphene", "usr/bin/", "755"],
    ["packaging/graphene.desktop", "usr/share/applications/", "644"],
    ["packaging/graphene.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/graphene-term/", "644"],
    ["LICENSE-MIT", "usr/share/doc/graphene-term/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/graphene-term/", "644"],
]

[package.metadata.generate-rpm]
name = "graphene-term"
assets = [
    { source = "target/release/graphene", dest = "/usr/bin/graphene", mode = "755" },
    { source = "packaging/graphene.desktop", dest = "/usr/share/applications/graphene.desktop", mode = "644" },
    { source = "packaging/graphene.svg", dest = "/usr/share/icons/hicolor/scalable/apps/graphene.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/graphene-term/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/graphene-term/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/graphene-term/LICENSE-APACHE", mode = "644" },
]

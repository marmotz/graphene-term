name: Release

on:
  push:
    branches: [develop]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DEB_VERSION: 3.8.0
  CARGO_GENERATE_RPM_VERSION: 0.21.1

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Find the CI binary of the merged pull request
        id: ci-binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "run-id=$(scripts/find-ci-binary.sh "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Download the CI binary
        if: steps.ci-binary.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: graphene-release
          path: target/release
          run-id: ${{ steps.ci-binary.outputs.run-id }}
          github-token: ${{ github.token }}

      # Artifacts do not keep file permissions.
      - name: Make the CI binary executable
        if: steps.ci-binary.outputs.run-id != ''
        run: chmod +x target/release/graphene

      # Fallback when no CI binary can be reused: build from source.
      - uses: actions/cache@v6
        if: steps.ci-binary.outputs.run-id == ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test
        if: steps.ci-binary.outputs.run-id == ''
        run: cargo test --locked

      # A fresh timestamp: a restored target/ cache must not carry an older one.
      - name: Release build
        if: steps.ci-binary.outputs.run-id == ''
        run: SOURCE_DATE_EPOCH=$(date +%s) cargo build --release --locked

      - name: Cache packaging tools
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-deb
            ~/.cargo/bin/cargo-generate-rpm
          key: ${{ runner.os }}-packaging-tools-${{ env.CARGO_DEB_VERSION }}-${{ env.CARGO_GENERATE_RPM_VERSION }}

      - name: Install packaging tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked "cargo-deb@${CARGO_DEB_VERSION}" \
            "cargo-generate-rpm@${CARGO_GENERATE_RPM_VERSION}"

      - name: Install appimagetool
        run: |
          curl -sSfL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Package
        id: package
        run: scripts/package.sh | tail -n1 >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --prerelease


name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_DEB_VERSION: 3.8.0
  CARGO_GENERATE_RPM_VERSION: 0.21.1
  GRAPHENE_CHANNEL: stable

jobs:
  guard:
    outputs:
      release_tag: ${{ steps.validate.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate the release tag
        id: validate
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Launch releases by selecting a vX.Y.Z tag (selected ref: $GITHUB_REF)." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main." >&2
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "graphene") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version." >&2
            exit 1
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  linux:
    needs: guard
    # Pinned: the binary links against the build host's glibc, so building on
    # ubuntu-latest (26.04, glibc 2.43) breaks Debian 13 (glibc 2.41) and older.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Cache packaging tools
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-deb
            ~/.cargo/bin/cargo-generate-rpm
          key: ${{ runner.os }}-packaging-tools-${{ env.CARGO_DEB_VERSION }}-${{ env.CARGO_GENERATE_RPM_VERSION }}

      - name: Install packaging tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked "cargo-deb@${CARGO_DEB_VERSION}" \
            "cargo-generate-rpm@${CARGO_GENERATE_RPM_VERSION}"

      - name: Install appimagetool
        run: |
          curl -sSfL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Package Linux release
        run: scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/aur/
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package macOS release
        env:
          GRAPHENE_BINARY: target/${{ matrix.target }}/release/graphene
        run: scripts/package-macos.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [guard, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          (
            cd dist
            shopt -s nullglob
            files=(*)
            for asset in "${files[@]}"; do
              [[ -f $asset && $asset != SHA256SUMS ]] || continue
              sha256sum -- "$asset"
            done
          ) > dist/SHA256SUMS

      - name: Generate categorized release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')
          scripts/release-notes.sh "$previous_tag" "$GITHUB_SHA" "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.release_tag }}
        run: |
          mapfile -d '' -t assets < <(find dist -mindepth 1 -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"


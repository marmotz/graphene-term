name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_DEB_VERSION: 3.8.0
  CARGO_GENERATE_RPM_VERSION: 0.21.1

jobs:
  guard:
    outputs:
      source_date_epoch: ${{ steps.timestamp.outputs.epoch }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the develop branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/develop" ]]; then
            echo "Launch releases from the develop branch (selected ref: $GITHUB_REF)." >&2
            exit 1
          fi
      - name: Set the release timestamp
        id: timestamp
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  linux:
    needs: guard
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: ${{ needs.guard.outputs.source_date_epoch }}
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Cache packaging tools
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-deb
            ~/.cargo/bin/cargo-generate-rpm
          key: ${{ runner.os }}-packaging-tools-${{ env.CARGO_DEB_VERSION }}-${{ env.CARGO_GENERATE_RPM_VERSION }}

      - name: Install packaging tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked "cargo-deb@${CARGO_DEB_VERSION}" \
            "cargo-generate-rpm@${CARGO_GENERATE_RPM_VERSION}"

      - name: Install appimagetool
        run: |
          curl -sSfL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Package Linux release
        id: package
        run: scripts/package.sh | tail -n1 >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/aur/
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.guard.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package macOS release
        env:
          GRAPHENE_BINARY: target/${{ matrix.target }}/release/graphene
        run: scripts/package-macos.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          find dist -mindepth 1 -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > dist/SHA256SUMS

      - name: Generate categorized release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')
          scripts/release-notes.sh "$previous_tag" "$GITHUB_SHA" "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.linux.outputs.tag }}
        run: |
          mapfile -d '' -t assets < <(find dist -mindepth 1 -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"


name: CI

on:
  pull_request:
    branches: [develop]
  # Runs on develop save the Cargo caches: caches saved by a pull request are
  # scoped to it and never reach the other pull requests.
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Smaller, faster debug builds: CI never reuses incremental state and never
  # needs debug info. Neither changes the code the tests run.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # Pull requests skip it: release.yml builds in release before publishing.
      # A fresh timestamp: a restored target/ cache must not carry an older one.
      - name: Release build
        if: github.event_name == 'push'
        run: SOURCE_DATE_EPOCH=$(date +%s) cargo build --release --locked

  check-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      # macOS-only cfg branches: warnings there are invisible to the Linux job.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # Pull requests skip it: release.yml builds in release before publishing.
      - name: Release build
        if: github.event_name == 'push'
        run: SOURCE_DATE_EPOCH=$(date +%s) cargo build --release --locked

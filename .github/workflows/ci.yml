name: CI

on:
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # A fresh timestamp: a restored target/ cache must not carry an older one.
      - name: Release build
        run: SOURCE_DATE_EPOCH=$(date +%s) cargo build --release --locked

  e2e:
    # Pinned to the Ubuntu release the GUI drivers were validated on (sway 1.9, wtype 0.4).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            grim imagemagick libgl1-mesa-dri libx11-6 libxkbcommon-x11-0 \
            libxcursor1 libxi6 libxinerama1 libxrandr2 mesa-vulkan-drivers \
            python3-pip sway wtype xdotool xvfb
          python3 -m pip install --no-deps --target "$RUNNER_TEMP/wayland-automation" \
            wayland-automation==0.3.1

      - name: Build Graphene
        run: cargo build --locked

      - name: Run X11 and Wayland smoke tests
        env:
          GRAPHENE_BIN: ${{ github.workspace }}/target/debug/graphene
          GRAPHENE_E2E_ARTIFACTS: ${{ runner.temp }}/graphene-e2e-artifacts
          PYTHONPATH: ${{ runner.temp }}/wayland-automation
        run: |
          mkdir -p "$GRAPHENE_E2E_ARTIFACTS"
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX +render -noreset" \
            tests/e2e/gui-automation-probe.sh x11
          tests/e2e/gui-automation-probe.sh wayland

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: graphene-e2e-failure-artifacts
          path: ${{ runner.temp }}/graphene-e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7

  check-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: SOURCE_DATE_EPOCH=$(date +%s) cargo build --release --locked
